name: "FRP客户端自定义配置版"
description: "支持网页配置页直接粘贴frpc.toml的frp加载项（HA侧边栏打开即用）"
version: "0.59.0-3"
slug: "frp_client_zdy"
host_network: true
startup: application
boot: "auto"
init: false
ingress: true
ingress_port: 8080
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  frpc_config: ""
  frpc_config_base64: ""
schema:
  frpc_config: str?
  frpc_config_base64: str?

