name: "FRP客户端自定义配置版"
description: "支持多类型多配置的frp加载项，直接在配置页面将frpc.toml内容粘贴到frpc_config即可"
version: "0.59.0-1"
slug: "frp_client_zdy"
host_network: true
startup: application
boot: "auto"
init: false
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  frpc_config: ""
schema:
  frpc_config: str?

